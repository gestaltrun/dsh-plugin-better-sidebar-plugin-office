# Gestaltrun Office viewer bundle layer.
# Loaded by `dsh plugin --profile <name> add @gestaltrun/dsh-sidebar-office`.
# The `name` is the package entry; the Loader resolves it from profile node_modules.
# The office plugin is client-only: its browser half registers the docx/xlsx/pptx
# file viewers through better-sidebar's `ctx.betterSidebar.registerFileViewer`.
- insert:
    - id: sidebar-office
      name: '@gestaltrun/dsh-sidebar-office'
